[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "linux-desktop-control"
version = "0.1.0b2"
description = "Local X11 desktop control over MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Akeem King"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "python-xlib==0.33", "mss==10.2.0", "Pillow==12.3.0", "tomlkit==0.15.1"]
[project.scripts]
linux-desktop-control = "linux_desktop_control.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.data-files]
"share/linux-desktop-control/skills/linux-desktop-control" = ["skills/linux-desktop-control/SKILL.md"]
"share/linux-desktop-control/skills/linux-desktop-control/agents" = ["skills/linux-desktop-control/agents/openai.yaml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
